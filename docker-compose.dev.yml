services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: book_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backend/seed_data/covers:/covers:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/book-covers;
      mc mb --ignore-existing local/user-avatars;
      mc anonymous set public local/book-covers;
      mc anonymous set public local/user-avatars;
      mc cp --no-clobber /covers/el_ultimo_algoritmo.png local/book-covers/el_ultimo_algoritmo.png;
      mc cp --no-clobber /covers/cronicas_del_viento.png local/book-covers/cronicas_del_viento.png;
      echo 'MinIO inicializado correctamente';
      "

volumes:
  postgres_data:
  minio_data:
